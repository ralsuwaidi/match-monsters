[project]
name = "match-monsters"
version = "0.1.0"
description = "Simulator, policy solver and self-play for the Plato game Match Monsters"
readme = "README.md"
# pinned below 3.14 because pandas/torch wheels do not exist for it yet;
# uv will fetch a suitable interpreter automatically
requires-python = ">=3.11,<3.14"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# reinforcement learning extras -- install with:  uv sync --extra rl
rl = [
    "gymnasium>=0.29",
    "numpy>=1.26",
    "torch>=2.2",
]

[project.scripts]
mm-play = "match_monsters.play:main"
mm-report = "match_monsters.sim:main"
mm-solve = "match_monsters.solver.race:main"
mm-evolve = "match_monsters.solver.evolve:main"
mm-trace = "match_monsters.analysis.trace:main"
mm-validate = "match_monsters.analysis.validate:main"
mm-rollout = "match_monsters.analysis.rollout:main"
mm-berry-sweep = "match_monsters.analysis.berry_sweep:main"
mm-berry-calibrate = "match_monsters.analysis.berry_calibrate:main"
mm-pretrain = "match_monsters.rl.pretrain:main"
mm-train = "match_monsters.rl.train:main"
mm-eval = "match_monsters.rl.evaluate:main"
mm-baseline = "match_monsters.rl.baselines:main"
mm-report-run = "match_monsters.rl.report:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/match_monsters"]
